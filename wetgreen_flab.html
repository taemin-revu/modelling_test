<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wetgreen_flab — 3D 표출 기법 비교 (D)</title>
<link rel="stylesheet" href="assets/compare.css">

<!-- bare specifier('three', 'three/examples/jsm/...')를 브라우저가 해석하게 해주는 매핑.
     번들러 없이 ESM import 를 쓰려면 필요하다. Chrome 89+, Safari 16.4+, Firefox 108+ -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- ══════ 이 페이지의 설정 ══════
     D 케이스: glb+hdr vs gltf+bin (포맷) × 재질감 유/무 (텍스처) 2x2 비교.
     4개 패널 모두 같은 HDR 환경맵 + 같은 3-라이트를 공유해서, 포맷과 재질 텍스처
     차이만 보이도록 조건을 맞췄다. 배열 순서(1,3,2,4)가 2열 그리드에서 그대로
     "1,3 / 2,4" 배치가 된다. -->
<script>
  window.PAGE = {
    model: 'wetgreen_flab',
    nav:   ['flab', 'flab_handleable', 'odit29', 'odit29_handleable', 'wetgreen_flab'],

    hdr: 'resources/D/wetgreen.hdr',

    cases: [
      { id: 1, type: 'glb',  file: 'resources/D/wetgreen_flab.glb',
        material: false, mb: '10.8' },
      { id: 3, type: 'glb',  file: 'resources/D/wetgreen_flab_texture.glb',
        material: true,  mb: '16.1' },
      { id: 2, type: 'gltf', file: 'resources/D/wetgreen_flab.gltf',
        resourceDir: 'resources/D/wetgreen_flab_resource/',
        material: false, mb: '11.2' },
      { id: 4, type: 'gltf', file: 'resources/D/wetgreen_flab_texture.gltf',
        resourceDir: 'resources/D/wetgreen_flab_texture/',
        material: true,  mb: '15.2' },
    ],

    zoom: 5,       // 네 영역 공통 — 크기를 맞춰야 비교가 된다
    angleX: 12
  };
</script>

<script type="module" src="assets/compare-d.js"></script>

</body>
</html>
