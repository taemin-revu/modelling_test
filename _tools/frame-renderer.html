<!DOCTYPE html>
<!-- 프레임 생성 도구. 상세페이지와 무관하며 배포 대상이 아님.
     _capture.js 가 헤드리스 Chrome 으로 이 페이지를 열어 각도별 스크린샷을 뽑는다. -->
<html><head><meta charset="utf-8"><title>frame renderer</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var MODEL = q.get('model');
  var AX    = parseFloat(q.get('ax') || 0);
  var AZ    = parseFloat(q.get('az') || 0);
  var ZOOM  = parseFloat(q.get('zoom') || 5);
  var SIZE  = parseInt(q.get('size') || 860, 10);
  var DEG   = Math.PI / 180;

  window.__ready = false;
  window.__error = null;

  // 상세페이지 뷰어와 동일한 세팅 — 프레임과 3D 버전의 구도를 일치시키기 위해
  var renderer = new THREE.WebGLRenderer({
    antialias: true, alpha: true, preserveDrawingBuffer: true
  });
  renderer.setPixelRatio(1);
  renderer.setSize(SIZE, SIZE, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var FOV = 32;
  var camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
  camera.position.set(0, 0, 9 - (ZOOM - 1) * (6 / 9));

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  var k = new THREE.DirectionalLight(0xffffff, 1.9);  k.position.set(4, 7, 5);   scene.add(k);
  var f = new THREE.DirectionalLight(0x99aacc, 0.55); f.position.set(-5, 2, -3); scene.add(f);
  var r = new THREE.DirectionalLight(0xaabbff, 0.45); r.position.set(0, -3, -6); scene.add(r);

  var pivot = new THREE.Group();
  pivot.rotation.order = 'ZXY';
  pivot.rotation.x =  AX * DEG;
  pivot.rotation.z = -AZ * DEG;
  scene.add(pivot);

  new THREE.GLTFLoader().load(MODEL, function (gltf) {
    var model = gltf.scene;
    model.traverse(function (c) {
      if (c.name && /^backdrop/i.test(c.name)) c.visible = false;
    });
    var box = new THREE.Box3();
    model.updateMatrixWorld(true);
    model.traverse(function (c) {
      if (!c.isMesh || !c.visible || !c.geometry) return;
      c.geometry.computeBoundingBox();
      var gb = c.geometry.boundingBox;
      if (gb && !gb.isEmpty()) box.union(gb.clone().applyMatrix4(c.matrixWorld));
    });
    if (!box.isEmpty()) {
      var size = box.getSize(new THREE.Vector3());
      var center = box.getCenter(new THREE.Vector3());
      var s = 2.6 / Math.max(size.x, size.y, size.z);
      model.scale.setScalar(s);
      model.position.set(-center.x * s, -center.y * s, -center.z * s);
    }
    pivot.add(model);
    window.__ready = true;
  }, undefined, function (e) {
    window.__error = String(e && e.message || e);
  });

  // 캡처 스크립트가 각도마다 호출
  window.__renderAt = function (deg) {
    pivot.rotation.y = deg * DEG;
    renderer.render(scene, camera);
    return true;
  };
})();
</script>
</body></html>
